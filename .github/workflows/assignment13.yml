on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MySQL
        run: |
          sudo systemctl start mysql
          sudo mysql -e "CREATE USER IF NOT EXISTS 'grader'@'localhost' IDENTIFIED BY 'grader123';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON *.* TO 'grader'@'localhost';"
          sudo mysql -e "FLUSH PRIVILEGES;"
          mysql -u grader -pgrader123 -e "CREATE DATABASE IF NOT EXISTS CollegeDB;"

      - name: Run Tests
        run: |
          chmod +x Assignment_13/test.sh
          ./Assignment_13/test.sh
