name: Assignment 13 - 3NF Autograding

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  autograding:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: CollegeDB
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Required Files
        run: |
          echo "Checking files..."

          test -f starter.sql
          test -f answers.sql
          test -f test.sh

          echo "All required files found."

      - name: Make Test Executable
        run: |
          chmod +x test.sh

      - name: Run Autograding
        env:
          MYSQL_PWD: root
        run: |
          ./test.sh
