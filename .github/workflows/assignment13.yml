name: Assignment 13 - 3NF Autograding

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  autograding:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start MySQL
        run: |
          sudo systemctl start mysql
          sudo systemctl status mysql --no-pager

      - name: Configure MySQL
        run: |
          sudo mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root';"
          sudo mysql -u root -proot -e "SELECT VERSION();"

      - name: Check Assignment Files
        run: |
          echo "Checking Assignment_13 files..."

          if [ ! -f "Assignment_13/starter.sql" ]; then
            echo "ERROR: Assignment_13/starter.sql not found"
            exit 1
          fi

          if [ ! -f "Assignment_13/answers.sql" ]; then
            echo "ERROR: Assignment_13/answers.sql not found"
            exit 1
          fi

          if [ ! -f "Assignment_13/test.sh" ]; then
            echo "ERROR: Assignment_13/test.sh not found"
            exit 1
          fi

          echo "All required files found."

      - name: Run Autograding
        working-directory: Assignment_13
        env:
          MYSQL_PWD: root
        run: |
          chmod +x test.sh
          ./test.sh
